<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">CheckStock — где сейчас товар</title>
  <desc id="d">Учёт остатков по складам фулфилмента: приход, резерв FBS, перемещение и FBO</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245f4b"/>
      <stop offset="1" stop-color="#143b30"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- мягкие круги на фоне -->
    <circle cx="1080" cy="-20" r="190" fill="#ffffff" opacity=".05"/>
    <circle cx="610" cy="360" r="170" fill="#ffffff" opacity=".04"/>
    <circle cx="40" cy="300" r="120" fill="#ffffff" opacity=".04"/>

    <!-- логотип и название -->
    <rect x="64" y="56" width="76" height="76" rx="20" fill="#ffffff" opacity=".16"/>
    <g transform="translate(76 68) scale(2)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
    </g>
    <text x="164" y="104" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">CheckStock</text>
    <text x="166" y="136" font-size="22" font-style="italic" fill="#f3c9b8">Где сейчас товар</text>

    <!-- описание -->
    <text x="64" y="196" font-size="23" fill="#ffffff" opacity=".95">Остатки по складам, резервы FBS,</text>
    <text x="64" y="226" font-size="23" fill="#ffffff" opacity=".95">перемещения и FBO без двойных списаний</text>

    <!-- технологии -->
    <g font-size="15" font-weight="600" fill="#ffffff">
      <rect x="64" y="256" width="92" height="34" rx="17" fill="#ffffff" opacity=".16"/>
      <text x="110" y="278" text-anchor="middle">FastAPI</text>
      <rect x="168" y="256" width="118" height="34" rx="17" fill="#ffffff" opacity=".16"/>
      <text x="227" y="278" text-anchor="middle">PostgreSQL</text>
      <rect x="298" y="256" width="124" height="34" rx="17" fill="#ffffff" opacity=".16"/>
      <text x="360" y="278" text-anchor="middle">SQLAlchemy</text>
      <rect x="434" y="256" width="86" height="34" rx="17" fill="#ffffff" opacity=".16"/>
      <text x="477" y="278" text-anchor="middle">Docker</text>
    </g>

    <!-- четыре действия, как в интерфейсе -->
    <g>
      <rect x="760" y="48" width="190" height="104" rx="18" fill="#ffffff" opacity=".12"/>
      <rect x="760" y="48" width="190" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="780" y="66" width="44" height="44" rx="13" fill="#3f9a79"/>
      <g transform="translate(788 74) scale(1.2)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
      <text x="780" y="138" font-size="19" font-weight="700" fill="#ffffff">Приход</text>

      <rect x="970" y="48" width="190" height="104" rx="18" fill="#ffffff" opacity=".12"/>
      <rect x="970" y="48" width="190" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="990" y="66" width="44" height="44" rx="13" fill="#d9a441"/>
      <g transform="translate(998 74) scale(1.2)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
      <text x="990" y="138" font-size="19" font-weight="700" fill="#ffffff">Резерв FBS</text>

      <rect x="760" y="168" width="190" height="104" rx="18" fill="#ffffff" opacity=".12"/>
      <rect x="760" y="168" width="190" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="780" y="186" width="44" height="44" rx="13" fill="#d9775a"/>
      <g transform="translate(788 194) scale(1.2)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h12v10H1z"/><path d="M13 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></g>
      <text x="780" y="258" font-size="19" font-weight="700" fill="#ffffff">Перемещение</text>

      <rect x="970" y="168" width="190" height="104" rx="18" fill="#ffffff" opacity=".12"/>
      <rect x="970" y="168" width="190" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="990" y="186" width="44" height="44" rx="13" fill="#d9775a"/>
      <g transform="translate(998 194) scale(1.2)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9z"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></g>
      <text x="990" y="258" font-size="19" font-weight="700" fill="#ffffff">FBO</text>
    </g>
  </g>
</svg>
