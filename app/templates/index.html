<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckStock — где сейчас товар</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f5a47'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M1 6h12v10H1z"/><path d="M13 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9z"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-warehouse" viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
  </defs></svg>

  <div id="progress" aria-hidden="true"></div>

  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="logo"><svg class="i"><use href="#i-box"/></svg></span>
        <div><h1>CheckStock</h1><span>Где сейчас товар</span></div>
      </div>
      <nav class="nav" role="tablist" aria-label="Разделы">
        <button type="button" class="navtab" role="tab" data-view="stock"><svg class="i"><use href="#i-box"/></svg><span class="lbl">Остатки</span></button>
        <button type="button" class="navtab" role="tab" data-view="ops"><svg class="i"><use href="#i-bell"/></svg><span class="lbl">Ждут действия</span><span id="ops-badge" class="badge" hidden></span></button>
        <button type="button" class="navtab" role="tab" data-view="history"><svg class="i"><use href="#i-clock"/></svg><span class="lbl">История</span></button>
        <button type="button" class="navtab" role="tab" data-view="warehouses"><svg class="i"><use href="#i-warehouse"/></svg><span class="lbl">Склады</span><span id="wh-count" class="badge soft" hidden></span></button>
      </nav>
    </aside>

    <div class="main">
      <header class="bar">
        <div class="titles"><h2 id="page-title"></h2><p id="page-sub"></p></div>
        <div class="bar-actions">
          <button id="refresh" class="btn ghost iconbtn" type="button" aria-label="Обновить данные" title="Обновить данные"><svg class="i"><use href="#i-refresh"/></svg></button>
          <div class="newwrap">
            <button id="new-btn" class="btn primary big" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-plus"/></svg><span>Операция</span><svg class="i caret"><use href="#i-down"/></svg></button>
            <div id="new-menu" class="menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <main class="page">
        <section id="view-stock" class="view">
          <div id="ops-notice" class="notice" hidden>
            <svg class="i"><use href="#i-bell"/></svg>
            <span id="ops-notice-text"></span>
            <button type="button" class="btn sm" data-view-go="ops">Перейти</button>
          </div>
          <div id="stats" class="stats"></div>

          <div class="panel">
            <div class="toolbar">
              <label class="search"><svg class="i"><use href="#i-search"/></svg>
                <input id="stock-search" type="search" placeholder="Найти товар" aria-label="Поиск товара"></label>
              <span id="icon-legend" class="icon-legend"></span>
            </div>
            <div class="plist-head gr" aria-hidden="true">
              <span>Товар и склады</span><span>На складе</span><span>Резерв</span><span>Доступно</span><span>В пути</span><span class="wa">Действия</span>
            </div>
            <div id="plist"></div>
            <p class="legend">
              <b>На складе</b> — физически лежит · <b>Резерв</b> — закреплено под заказы FBS ·
              <b>Доступно</b> = На складе − Резерв · <b>В пути</b> — уже уехало и пока не числится на складах.
            </p>
          </div>
        </section>

        <section id="view-ops" class="view" hidden>
          <ul id="ops-list" class="list"></ul>
          <h3 class="sec">Уже отправлено клиентам</h3>
          <ul id="ops-done" class="list"></ul>
        </section>

        <section id="view-history" class="view" hidden>
          <div class="sec-head"><label class="inline">Склад <select id="history-filter"></select></label></div>
          <ul id="history" class="list"></ul>
        </section>

        <section id="view-warehouses" class="view" hidden>
          <div class="panel narrow">
            <ul id="wh-list" class="wh-list"></ul>
            <p id="wh-error" class="form-error" role="alert" hidden></p>
            <form id="wh-form" class="wh-add" novalidate>
              <input id="wh-name" type="text" maxlength="255" placeholder="Название нового склада" aria-label="Название нового склада">
              <button class="btn primary" type="submit"><svg class="i"><use href="#i-plus"/></svg>Добавить</button>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="ad-dialog" aria-labelledby="ad-title">
    <form id="ad-form" novalidate>
      <header class="ad-head">
        <h3 id="ad-title">Новая операция</h3>
        <button type="button" class="btn ghost iconbtn" id="ad-close" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div id="ad-kinds" class="kinds" role="tablist" aria-label="Тип операции"></div>
      <p class="ad-chosen" id="ad-chosen"></p>
      <label>Товар <select id="ad-product"></select></label>
      <label><span id="ad-wh-text">Склад</span> <select id="ad-wh"></select></label>
      <label id="ad-dest-row" hidden>Куда отправить <select id="ad-dest"></select></label>
      <p id="ad-avail" class="ad-avail"></p>
      <label><span id="ad-qty-label">Количество</span>
        <span class="qty-row">
          <button type="button" class="step" id="ad-minus" aria-label="Меньше"><svg class="i"><use href="#i-minus"/></svg></button>
          <input id="ad-qty" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
          <button type="button" class="step" id="ad-plus" aria-label="Больше"><svg class="i"><use href="#i-plus"/></svg></button>
          <button type="button" class="btn" id="ad-max"></button>
        </span>
      </label>
      <label id="ad-reason-row" hidden>Причина
        <input id="ad-reason" type="text" maxlength="255" placeholder="Например: пересчёт, брак, ошибочный приход">
      </label>
      <p id="ad-error" class="form-error" role="alert" hidden></p>
      <div class="ad-buttons">
        <button type="button" class="btn" id="ad-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="ad-submit"></button>
      </div>
    </form>
  </dialog>

  <dialog id="cf-dialog" aria-labelledby="cf-title">
    <form method="dialog" class="cf">
      <span id="cf-ico" class="ico"></span>
      <h3 id="cf-title"></h3>
      <p id="cf-text"></p>
      <input id="cf-input" type="text" maxlength="255" aria-label="Название склада" hidden>
      <div class="cf-buttons">
        <button type="button" class="btn" id="cf-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="cf-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
